
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❤️</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        /* Khung hiệu ứng trái tim */
        #container {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 9999;
        }

        /* Trái tim rơi */
        .snow {
            position: absolute;
            top: -35px;
            color: #ff1744;
            font-size: 22px;
            line-height: 1;
            opacity: 0.9;
            animation: heartFall 5s linear forwards;
            filter: drop-shadow(0 0 4px rgba(255, 50, 100, 0.35));
            will-change: transform;
        }

        @keyframes heartFall {
            0% {
                transform: translateY(-10px) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.9;
            }

            50% {
                transform: translateY(50vh) rotate(180deg) translateX(20px);
            }

            100% {
                transform: translateY(110vh) rotate(360deg) translateX(-20px);
                opacity: 0;
            }
        }

        #player-controls .button {
            cursor: pointer;
        }

        #album-art img {
            object-fit: cover;
        }

        #ins-time {
            display: none;
        }

        #s-area {
            cursor: pointer;
            touch-action: none;
        }
    </style>
</head>

<body>

    <!-- Hiệu ứng trái tim -->
    <div id="container"></div>

    <!-- Trình phát nhạc -->
    <div id="app-cover">
        <div id="bg-artwork"></div>
        <div id="bg-layer"></div>

        <div id="player">

            <div id="player-track">
                <div id="album-name"></div>
                <div id="track-name"></div>

                <div id="track-time">
                    <div id="current-time">00:00</div>
                    <div id="track-length">00:00</div>
                </div>

                <div id="s-area">
                    <div id="ins-time"></div>
                    <div id="s-hover"></div>
                    <div id="seek-bar"></div>
                </div>
            </div>

            <div id="player-content">

                <div id="album-art">
                    <img src="tuan.jpg" class="active" id="_1" alt="Ảnh bìa bài 1">
                    <img src="tuan.jpg" id="_2" alt="Ảnh bìa bài 2">
                    <img src="tuan.jpg" id="_3" alt="Ảnh bìa bài 3">
                    <div id="buffer-box">Đang tải...</div>
                </div>

                <div id="player-controls">

                    <div class="control">
                        <div class="button" id="play-previous" title="Bài trước">
                            <i class="fas fa-backward"></i>
                        </div>
                    </div>

                    <div class="control">
                        <div class="button" id="play-pause-button" title="Phát / Tạm dừng">
                            <i class="fas fa-play"></i>
                        </div>
                    </div>

                    <div class="control">
                        <div class="button" id="play-next" title="Bài tiếp theo">
                            <i class="fas fa-forward"></i>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", function () {

        // Danh sách bài hát
        const tracks = [
               {
                name: "Hơn cả yêu",
                file: "HonCaYeu.mp3",
                image: "_2"
            },
            {
                name: "Ngày đầu tiên",
                file: "NgayDauTien.mp3",
                image: "_1"
            },

            {
                name: "Ánh nắng của anh",
                file: "AnhNangCuaAnh.wav",
                image: "_3"
            }
        ];

        const $ = id => document.getElementById(id);

        const playerTrack = $("player-track");
        const albumArt = $("album-art");
        const albumName = $("album-name");
        const trackName = $("track-name");
        const currentTimeText = $("current-time");
        const trackLengthText = $("track-length");
        const seekArea = $("s-area");
        const seekBar = $("seek-bar");
        const hoverBar = $("s-hover");
        const hoverTime = $("ins-time");
        const playButton = $("play-pause-button");
        const playIcon = playButton.querySelector("i");

        let index = 0;
        let seeking = false;
        let autoplayBlocked = false;


        const audio = new Audio();
        audio.preload = "auto";
        audio.volume = 1;


        function formatTime(seconds) {
            if (!Number.isFinite(seconds) || seconds < 0) {
                return "00:00";
            }

            const minutes = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);

            return String(minutes).padStart(2, "0") + ":" +
                   String(secs).padStart(2, "0");
        }


        function updateButton(playing) {
            playIcon.className = playing
                ? "fas fa-pause"
                : "fas fa-play";

            playerTrack.classList.toggle("active", playing);
            albumArt.classList.toggle("active", playing);
        }


        function showTrack() {
            const track = tracks[index];

            albumName.textContent = track.name;
            trackName.textContent = "";

            document.querySelectorAll("#album-art img")
                .forEach(img => img.classList.remove("active"));

            $(track.image).classList.add("active");

            $("bg-artwork").style.backgroundImage =
                "url('" + $(track.image).src + "')";

            currentTimeText.textContent = "00:00";
            trackLengthText.textContent = "00:00";

            seekBar.style.width = "0%";
            hoverBar.style.width = "0%";
        }


        async function playCurrentTrack() {
            try {
                await audio.play();

                autoplayBlocked = false;
                updateButton(true);
            } catch (error) {
                autoplayBlocked = true;
                updateButton(false);

                console.warn(
                    "Trình duyệt chưa cho phép tự phát nhạc:",
                    error.name,
                    error.message
                );
            }
        }


        function loadTrack(newIndex, autoplay = true) {
            index = (newIndex + tracks.length) % tracks.length;

            audio.pause();
            audio.src = tracks[index].file;
            audio.load();

            showTrack();

            if (autoplay) {
                playCurrentTrack();
            } else {
                updateButton(false);
            }
        }


        playButton.addEventListener("click", function () {
            if (audio.paused) {
                playCurrentTrack();
            } else {
                audio.pause();
                updateButton(false);
            }
        });


        $("play-previous").addEventListener("click", function () {
            loadTrack(index - 1);
        });

        $("play-next").addEventListener("click", function () {
            loadTrack(index + 1);
        });


        audio.addEventListener("loadedmetadata", function () {
            trackLengthText.textContent = formatTime(audio.duration);
        });


        audio.addEventListener("timeupdate", function () {
            currentTimeText.textContent = formatTime(audio.currentTime);

            if (Number.isFinite(audio.duration) && audio.duration > 0) {
                trackLengthText.textContent = formatTime(audio.duration);

                if (!seeking) {
                    seekBar.style.width =
                        (audio.currentTime / audio.duration * 100) + "%";
                }
            }
        });


        audio.addEventListener("ended", function () {
            loadTrack(index + 1);
        });

        audio.addEventListener("error", function () {
            updateButton(false);

            console.error(
                "Không tải được file nhạc:",
                tracks[index].file,
                audio.error
            );
        });

        function seek(event) {
            if (!Number.isFinite(audio.duration) || audio.duration <= 0) {
                return;
            }

            const rect = seekArea.getBoundingClientRect();

            if (rect.width <= 0) return;

            const percent = Math.max(
                0,
                Math.min(1, (event.clientX - rect.left) / rect.width)
            );

            audio.currentTime = percent * audio.duration;
            seekBar.style.width = (percent * 100) + "%";
        }

        seekArea.addEventListener("pointerdown", function (event) {
            seeking = true;
            seek(event);
        });

        document.addEventListener("pointermove", function (event) {
            if (seeking) seek(event);
        });

        document.addEventListener("pointerup", function () {
            seeking = false;
        });

        seekArea.addEventListener("mousemove", function (event) {
            if (!Number.isFinite(audio.duration) || audio.duration <= 0) {
                return;
            }

            const rect = seekArea.getBoundingClientRect();

            const percent = Math.max(
                0,
                Math.min(1, (event.clientX - rect.left) / rect.width)
            );

            hoverBar.style.width = (percent * 100) + "%";
            hoverTime.textContent = formatTime(percent * audio.duration);
            hoverTime.style.left = (percent * rect.width) + "px";
            hoverTime.style.display = "block";
        });

        seekArea.addEventListener("mouseleave", function () {
            hoverBar.style.width = "0%";
            hoverTime.style.display = "none";
        });

        // Thử phát nhạc ngay khi mở trang
        loadTrack(0);

        // Nếu trình duyệt chặn tự phát, thử lại sau tương tác đầu tiên
        function retryAutoplay() {
            if (autoplayBlocked && audio.paused) {
                playCurrentTrack();
            }

            document.removeEventListener("pointerdown", retryAutoplay);
            document.removeEventListener("keydown", retryAutoplay);
        }

        document.addEventListener("pointerdown", retryAutoplay);
        document.addEventListener("keydown", retryAutoplay);


        const heartContainer = $("container");

        const heartColors = [
            "#ff1744",
            "#ff4081",
            "#ff69b4",
            "#e91e63",
            "#ff80ab",
            "#ff3366"
        ];

        function createHeart() {
            const heart = document.createElement("div");

            heart.className = "snow";
            heart.textContent = "♥";

            heart.style.left =
                Math.random() * window.innerWidth + "px";

            heart.style.fontSize =
                (12 + Math.random() * 18) + "px";

            heart.style.color =
                heartColors[Math.floor(Math.random() * heartColors.length)];

            heart.style.animationDuration =
                (3 + Math.random() * 4) + "s";

            heart.style.opacity =
                String(0.4 + Math.random() * 0.6);

            heartContainer.appendChild(heart);

            heart.addEventListener("animationend", function () {
                heart.remove();
            });
        }


        setInterval(createHeart, 180);

    });
    </script>

</body>
</html>
